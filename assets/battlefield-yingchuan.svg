    <stop offset=".48" stop-color="#52747a"/>
    <stop offset="1" stop-color="#3e5c61"/>
  </linearGradient>
  <linearGradient id="road" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#b29a67"/>
    <stop offset=".55" stop-color="#c0a56f"/>
    <stop offset="1" stop-color="#aa8d5c"/>
  </linearGradient>
  <linearGradient id="cliff" x1="0" x2="1">
    <stop stop-color="#6b6048"/>
    <stop offset=".65" stop-color="#80735a"/>
    <stop offset="1" stop-color="#5b5240"/>

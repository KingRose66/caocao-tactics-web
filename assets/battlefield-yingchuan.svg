    <path d="M-30-8L0-29 30-7" fill="none" stroke="#8b5a3c" stroke-width="7" opacity=".7"/>
    <rect x="-8" y="12" width="16" height="22" fill="#493429"/>
    <rect x="15" y="5" width="8" height="9" fill="#d0b174"/>
  </g>

<svg xmlns="http://www.w3.org/2000/svg" width="448" height="320" viewBox="0 0 448 320" shape-rendering="crispEdges">
<defs>
  <pattern id="soil" width="16" height="16" patternUnits="userSpaceOnUse">
    <rect width="16" height="16" fill="#8a7a55"/>
    <rect x="1" y="3" width="4" height="1" fill="#998a63"/>
    <rect x="8" y="2" width="2" height="1" fill="#6e6548"/>
    <rect x="12" y="7" width="3" height="1" fill="#a19168"/>
    <rect x="3" y="10" width="2" height="1" fill="#706549"/>
    <rect x="6" y="14" width="5" height="1" fill="#9a8961"/>
    <rect x="14" y="12" width="1" height="3" fill="#655e43"/>
  </pattern>
  <pattern id="grass" width="18" height="18" patternUnits="userSpaceOnUse">
    <rect width="18" height="18" fill="#72784b"/>
    <rect x="2" y="3" width="5" height="1" fill="#80865a"/>
    <rect x="11" y="5" width="2" height="1" fill="#59623c"/>
    <rect x="5" y="12" width="1" height="3" fill="#536039"/>
    <rect x="13" y="14" width="3" height="1" fill="#8e8455"/>
    <rect x="1" y="16" width="2" height="1" fill="#5e653e"/>
  </pattern>
  <pattern id="water" width="24" height="18" patternUnits="userSpaceOnUse">
    <rect width="24" height="18" fill="#4b6a70"/>
    <rect x="3" y="4" width="9" height="1" fill="#6e8a8e"/>
    <rect x="14" y="7" width="7" height="1" fill="#3f5d63"/>
    <rect x="7" y="13" width="12" height="1" fill="#789296"/>
    <rect x="1" y="16" width="6" height="1" fill="#36565c"/>
  </pattern>
  <g id="tree">
    <rect x="13" y="24" width="4" height="11" fill="#4a3325"/>
    <rect x="9" y="7" width="13" height="7" fill="#263c22"/>
    <rect x="5" y="12" width="20" height="10" fill="#2f4a28"/>
    <rect x="2" y="17" width="25" height="9" fill="#35542d"/>
    <rect x="8" y="13" width="12" height="8" fill="#4b6b38"/>
    <rect x="18" y="10" width="8" height="8" fill="#3d5e31"/>
    <rect x="5" y="23" width="19" height="4" fill="#294629"/>
  </g>
  <g id="pine">
    <rect x="14" y="24" width="3" height="11" fill="#443123"/>
    <path d="M15 3L5 15h6L3 23h24l-8-8h6z" fill="#263e29"/>
    <path d="M15 8L8 17h5L7 22h16l-6-5h5z" fill="#3b5a32"/>
    <rect x="11" y="20" width="8" height="3" fill="#4b6a38"/>
  </g>
  <g id="house">
    <rect x="3" y="13" width="19" height="12" fill="#a27a52"/>
    <rect x="6" y="15" width="13" height="10" fill="#aa8359"/>
    <path d="M0 14L12 3l13 11z" fill="#5b3828"/>
    <rect x="9" y="18" width="5" height="7" fill="#4b3328"/>
    <rect x="17" y="17" width="3" height="3" fill="#c4a56d"/>
  </g>
  <g id="rock">
    <path d="M2 11L8 2l7 3 5 10-4 8H4z" fill="#645842"/>
    <path d="M8 2l7 3-4 7-7 2z" fill="#80725a"/>
    <path d="M10 13l6-4 4 6-4 8z" fill="#4d4436"/>
  </g>
</defs>

<!-- earthy base like an old PC SRPG map -->
<rect width="448" height="320" fill="url(#soil)"/>
<path d="M0 40C73 18 150 24 206 55c43 23 84 24 120 10 44-17 81-10 122 4v111c-46-18-90-19-135-3-51 18-103 19-157 1C99 158 47 162 0 179z" fill="url(#grass)" opacity=".88"/>
<path d="M0 185c56-14 104-8 154 14 57 25 109 28 159 10 51-18 91-11 135 5v106H0z" fill="#77794b" opacity=".86"/>
<path d="M15 11c72 15 124 12 169-7M4 101c58 6 110 1 157-15M16 259c56 6 102 2 147-16M310 252c47-10 85-7 124 7" fill="none" stroke="#aa956a" stroke-width="2" opacity=".24"/>

<!-- upper-left dry terrace / cliff -->
<path d="M0 0h100v54l-18 18H0z" fill="#a08b63"/>
<path d="M0 10h80M0 24h94M0 39h84" stroke="#c0a876" stroke-width="2" opacity=".65"/>
<path d="M0 55h95v13H0z" fill="#57412e"/>
<path d="M0 55h95v3H0z" fill="#7d6044"/>
<g transform="translate(83 45)"><use href="#rock"/><use href="#rock" x="17" y="-4"/><use href="#rock" x="34" y="2"/></g>

<!-- river, natural banks and darker water -->
<path d="M226 0c-3 54 3 93 0 139-2 44 4 94 1 181h111c-3-78 4-124 0-176-4-49 4-91 0-144z" fill="#9b8761"/>
<path d="M238 0c-3 55 4 94 1 139-2 45 4 95 1 181h85c-3-79 4-124 0-176-4-49 4-92 1-144z" fill="url(#water)"/>
<path d="M232 0c-2 55 4 94 1 139-2 45 4 95 1 181" fill="none" stroke="#645e48" stroke-width="3"/>
<path d="M331 0c3 55-4 94-1 139 2 45-4 95-1 181" fill="none" stroke="#645e48" stroke-width="3"/>
<path d="M237 0c-2 55 5 95 2 140-2 44 5 94 2 180" fill="none" stroke="#b29b6d" stroke-width="2" opacity=".65"/>
<path d="M326 0c2 55-5 95-2 140 2 44-5 94-2 180" fill="none" stroke="#b29b6d" stroke-width="2" opacity=".65"/>

<!-- horizontal timber bridge -->
<g transform="translate(235 120)">
  <rect x="0" y="0" width="97" height="54" fill="#5d422e"/>
  <rect x="0" y="5" width="97" height="5" fill="#33251c"/>
  <rect x="0" y="44" width="97" height="5" fill="#33251c"/>
  <g fill="#9a7550"><rect x="5" width="7" height="54"/><rect x="18" width="7" height="54"/><rect x="31" width="7" height="54"/><rect x="44" width="7" height="54"/><rect x="57" width="7" height="54"/><rect x="70" width="7" height="54"/><rect x="83" width="7" height="54"/></g>
  <g fill="#704f35"><rect x="8" width="2" height="54"/><rect x="21" width="2" height="54"/><rect x="34" width="2" height="54"/><rect x="47" width="2" height="54"/><rect x="60" width="2" height="54"/><rect x="73" width="2" height="54"/><rect x="86" width="2" height="54"/></g>
</g>

<!-- road: less clean, more like a worn military route -->
<path d="M18 312C66 286 114 254 158 224c32-22 59-43 81-65" fill="none" stroke="#715b40" stroke-width="22" stroke-linecap="round"/>
<path d="M18 312C66 286 114 254 158 224c32-22 59-43 81-65" fill="none" stroke="#b0905f" stroke-width="14" stroke-linecap="round"/>
<path d="M326 143c34-24 66-48 111-80" fill="none" stroke="#715b40" stroke-width="22" stroke-linecap="round"/>
<path d="M326 143c34-24 66-48 111-80" fill="none" stroke="#b0905f" stroke-width="14" stroke-linecap="round"/>
<g fill="#655037" opacity=".75"><rect x="52" y="286" width="10" height="2"/><rect x="86" y="266" width="6" height="2"/><rect x="127" y="239" width="9" height="2"/><rect x="171" y="210" width="10" height="2"/><rect x="207" y="185" width="7" height="2"/><rect x="349" y="126" width="9" height="2"/><rect x="390" y="95" width="7" height="2"/></g>

<!-- forests: irregular and denser, not icon-like rows -->
<g transform="translate(20 34)"><use href="#tree"/><use href="#tree" x="23" y="-5"/><use href="#tree" x="47" y="4"/><use href="#pine" x="67" y="1"/><use href="#tree" x="8" y="26"/><use href="#tree" x="36" y="24"/><use href="#tree" x="63" y="29"/><use href="#pine" x="79" y="23"/></g>
<g transform="translate(57 107)"><use href="#tree"/><use href="#tree" x="27" y="-6"/><use href="#pine" x="53" y="2"/><use href="#tree" x="12" y="27"/><use href="#tree" x="40" y="30"/><use href="#tree" x="67" y="26"/></g>
<g transform="translate(-7 210)"><use href="#tree"/><use href="#tree" x="27" y="-4"/><use href="#pine" x="53" y="3"/><use href="#tree" x="14" y="28"/><use href="#tree" x="43" y="26"/><use href="#pine" x="69" y="30"/></g>
<g transform="translate(338 106)"><use href="#tree"/><use href="#pine" x="25" y="-2"/><use href="#tree" x="48" y="4"/><use href="#tree" x="11" y="29"/><use href="#tree" x="38" y="26"/><use href="#pine" x="68" y="31"/></g>
<g transform="translate(336 214)"><use href="#tree"/><use href="#tree" x="28" y="-5"/><use href="#pine" x="55" y="3"/><use href="#tree" x="13" y="28"/><use href="#tree" x="42" y="27"/><use href="#tree" x="71" y="31"/></g>

<!-- villages -->
<g transform="translate(361 42)"><use href="#house"/><use href="#house" x="26" y="10"/><rect x="-7" y="29" width="63" height="3" fill="#6b5539" opacity=".7"/></g>
<g transform="translate(162 188)"><use href="#house"/><use href="#house" x="27" y="10"/><rect x="-5" y="29" width="61" height="3" fill="#6b5539" opacity=".65"/></g>


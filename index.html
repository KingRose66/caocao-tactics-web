<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0d0d0d">
  <title>魏武英杰传 · 颍川之战</title>
  <link rel="stylesheet" href="css/game.css?v=14">
  <link rel="stylesheet" href="css/battle14.css?v=14">
</head>
<body>
<main class="game">
  <header class="topbar">
    <div class="brand"><span class="crest">魏</span><div><h1>魏武英杰传</h1><small>经典战棋重构版</small></div></div>
    <div class="stage-badge">BATTLE BUILD 14</div>
  </header>
  <section class="battle-head">
    <div><h2>颍川之战</h2><p>突破河桥防线，击破张宝。曹操阵亡则失败。</p></div>
    <div class="turn-box"><span class="tag turn" id="turnText">第 1 回合</span><span class="tag" id="phaseText">我军阶段</span></div>
  </section>
  <section class="battle-layout">
    <div class="left-col">
      <div class="battlefield" id="battlefield">
        <img id="mapImage" alt="颍川之战连续战场地图" width="1120" height="800">
        <div class="logic-grid" id="logicGrid" aria-label="隐藏逻辑棋盘"></div>
        <div class="range-layer" id="rangeLayer"></div><div class="unit-layer" id="unitLayer"></div><div class="fx-layer" id="fxLayer"></div>
      </div>
      <div class="commands"><span class="command-text" id="commandText">正在加载战场…</span><button id="btnAttack">攻击</button><button id="btnSkill">技能</button><button id="btnWait">待机</button><button id="btnCancel">返回</button><button id="btnEnd">结束回合</button></div>
      <div class="dialogue"><div class="mini-portrait" id="dialogPortrait"></div><div><b>曹操</b><p>桥头不可硬挤。先夺桥面、压住敌弓手，再提防东岸骑兵反冲。</p><div class="map-status" id="mapStatus">正在校验高清战场地图…</div></div></div>
    </div>
    <aside class="side">
      <section class="panel" id="unitInfo"><div class="panel-title">武将 <span>未选择</span></div><div class="empty-info">点击我军武将查看信息并行动。</div></section>
      <section class="panel" id="terrainInfo"><div class="panel-title">地形 <span>—</span></div><div class="terrain-body">指向地图位置查看。</div></section>
      <section class="panel"><div class="panel-title">战况 <span id="scoreText">4 : 7</span></div><div class="battle-stats"><div><small>我军</small><b>4</b></div><div><small>敌军</small><b>7</b></div><div><small>回合限制</small><b>18</b></div><div><small>目标</small><b id="goalText">击破张宝</b></div></div></section>
      <section class="panel"><div class="panel-title">战报 <span>最新在上</span></div><ul class="battle-log" id="battleLog"></ul></section>
    </aside>
  </section>
</main>
<div class="result-modal" id="resultModal"><div class="result-card"><h2 id="resultTitle">胜利</h2><p id="resultText"></p><button id="btnRestart">重玩本关</button></div></div>
<script type="module" src="src/game.js?v=14"></script>
</body></html>
